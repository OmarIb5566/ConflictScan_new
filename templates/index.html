<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConflictScan</title>
  <link rel="icon" href="/static/Rowad-Logo.png">
  <link rel="stylesheet" href="/static/app.css">
  <script>
    // Apply the saved theme before first paint so there is no light flash in dark mode.
    (function () {
      var t = "system";
      try { t = localStorage.getItem("cs.theme") || "system"; } catch (e) {}
      if (t === "system") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>

<!-- ============================== sign in ============================== -->
<div id="auth" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <img src="/static/Rowad-Logo.png" alt="Rowad">
      <div>
        <h1>ConflictScan</h1>
        <div class="hint">Document-set conflict review &amp; RFI drafting</div>
      </div>
    </div>
    <div class="segmented" id="auth-mode">
      <button type="button" data-mode="login" class="on">Sign in</button>
      <button type="button" data-mode="register">Create account</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <p id="auth-first" class="banner info" hidden>No accounts yet &mdash; create the first one to get started.</p>
      <label class="field"><span>Username</span>
        <input name="username" autocomplete="username" required autofocus></label>
      <label class="field" data-register><span>Display name</span>
        <input name="display_name" autocomplete="name" placeholder="How your name appears on runs and edits"></label>
      <p class="hint" id="auth-dir-hint" hidden>Use your company (Windows) sign-in, e.g. DOMAIN\username.</p>
      <label class="field"><span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required></label>
      <label class="row small muted" data-login style="gap:6px;">
        <input type="checkbox" name="remember" checked style="width:auto;"> Keep me signed in
      </label>
      <div id="auth-error" class="form-error" hidden></div>
      <button class="btn primary block lg" type="submit" id="auth-submit">Sign in</button>
    </form>
  </div>
</div>

<!-- ============================== app ============================== -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="nav-toggle" title="Menu">&#9776;</button>
    <div class="brand" id="brand" title="Home">
      <img src="/static/Rowad-Logo.png" alt="Rowad">
      <div>
        <div class="brand-name">ConflictScan</div>
        <div class="brand-sub">RFI automation</div>
      </div>
    </div>
    <button class="search-trigger" id="search-trigger" type="button">
      <span>&#8981;</span><span class="label">Search projects, scans, actions&hellip;</span><kbd>Ctrl K</kbd>
    </button>
    <button class="icon-btn" id="help-btn" title="Keyboard shortcuts (?)">?</button>
    <button class="icon-btn" id="theme-btn" title="Toggle dark mode">&#9680;</button>
    <button class="user-btn" id="user-btn" type="button">
      <span class="avatar" id="user-avatar"></span><span class="name" id="user-name"></span>
    </button>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <button class="btn primary block lg" id="new-scan-btn" type="button">+ New scan</button>
      <nav class="side-nav">
        <a data-nav="home" id="nav-home">&#8962;&nbsp; Home</a>
      </nav>
      <div>
        <div class="side-title">Scans in progress</div>
        <div id="side-jobs"><div class="side-empty">Nothing running.</div></div>
      </div>
      <div>
        <div class="side-title">Pinned</div>
        <div id="side-pinned"></div>
      </div>
      <div>
        <div class="side-title">Recent projects</div>
        <div id="side-recent"></div>
      </div>
      <div class="grow"></div>
      <div class="hint" id="template-line" style="padding:0 10px;"></div>
    </aside>

    <main class="main">
      <nav class="tabbar" id="tabbar" aria-label="Open work"></nav>
      <div class="views" id="views"></div>
    </main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/app.js"></script>
<script src="/static/admin.js"></script>
<script src="/static/project_extras.js"></script>
<script src="/static/rfilog.js"></script>
</body>
</html>
